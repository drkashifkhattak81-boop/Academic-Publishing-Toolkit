<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <g transform="translate(40, 30)">
    <text x="0" y="24" font-size="22" font-weight="700" fill="#1e3a8a">PRISMA 2020 Flow Diagram for Systematic Reviews</text>
    <text x="0" y="46" font-size="12" fill="#64748b">Standard template for new systematic reviews searching databases and registers ? Page et al. (BMJ 2021;372:n71)</text>
  </g>

  <!-- Left Phase Headers -->
  <!-- Phase 1: Identification -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="130" height="170" rx="8" fill="#1e3a8a" />
    <text x="65" y="90" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">IDENTIFICATION</text>
  </g>

  <!-- Phase 2: Screening -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="130" height="380" rx="8" fill="#1e3a8a" />
    <text x="65" y="195" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">SCREENING</text>
  </g>

  <!-- Phase 3: Included -->
  <g transform="translate(40, 690)">
    <rect x="0" y="0" width="130" height="120" rx="8" fill="#1e3a8a" />
    <text x="65" y="65" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">INCLUDED</text>
  </g>

  <!-- Main Flow Cards -->
  <!-- 1. Identification Box -->
  <g transform="translate(200, 100)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="170" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#1e3a8a">Records identified from databases &amp; registers</text>
    <line x1="20" y1="42" x2="380" y2="42" stroke="#bfdbfe" stroke-width="1" />
    <text x="20" y="68" font-size="12" fill="#1e293b" font-weight="600">Databases (n = ______):</text>
    <text x="35" y="90" font-size="12" fill="#475569">? Scopus (n = _____)</text>
    <text x="35" y="110" font-size="12" fill="#475569">? Web of Science (n = _____)</text>
    <text x="35" y="130" font-size="12" fill="#475569">? PubMed / IEEE Xplore (n = _____)</text>
    <text x="20" y="152" font-size="12" fill="#1e293b" font-weight="600">Registers (e.g. ClinicalTrials.gov) (n = _____)</text>
  </g>

  <!-- Excluded Before Screening -->
  <g transform="translate(660, 100)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="170" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#991b1b">Records removed before screening</text>
    <line x1="20" y1="42" x2="380" y2="42" stroke="#fecaca" stroke-width="1" />
    <text x="20" y="70" font-size="12" fill="#334155">? Duplicate records removed (n = _____)</text>
    <text x="20" y="100" font-size="12" fill="#334155">? Marked ineligible by automation tools (n = _____)</text>
    <text x="20" y="130" font-size="12" fill="#334155">? Removed for other specific reasons (n = _____)</text>
  </g>

  <!-- 2. Records Screened -->
  <g transform="translate(200, 310)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#1e3a8a">Records screened</text>
    <line x1="20" y1="40" x2="380" y2="40" stroke="#bfdbfe" stroke-width="1" />
    <text x="20" y="65" font-size="13" fill="#1e293b">Total records screened against criteria (n = _____)</text>
  </g>

  <!-- Records Excluded (Screening) -->
  <g transform="translate(660, 310)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="85" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#991b1b">Records excluded**</text>
    <line x1="20" y1="40" x2="380" y2="40" stroke="#fecaca" stroke-width="1" />
    <text x="20" y="65" font-size="13" fill="#334155">Excluded after title &amp; abstract screening (n = _____)</text>
  </g>

  <!-- 3. Reports Sought for Retrieval -->
  <g transform="translate(200, 435)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#1e3a8a">Reports sought for retrieval</text>
    <line x1="20" y1="40" x2="380" y2="40" stroke="#bfdbfe" stroke-width="1" />
    <text x="20" y="65" font-size="13" fill="#1e293b">Full-text reports sought for retrieval (n = _____)</text>
  </g>

  <!-- Reports Not Retrieved -->
  <g transform="translate(660, 435)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="85" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#991b1b">Reports not retrieved</text>
    <line x1="20" y1="40" x2="380" y2="40" stroke="#fecaca" stroke-width="1" />
    <text x="20" y="65" font-size="13" fill="#334155">Full-text reports unable to be retrieved (n = _____)</text>
  </g>

  <!-- 4. Reports Assessed for Eligibility -->
  <g transform="translate(200, 560)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="95" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#1e3a8a">Reports assessed for eligibility</text>
    <line x1="20" y1="40" x2="380" y2="40" stroke="#bfdbfe" stroke-width="1" />
    <text x="20" y="65" font-size="13" fill="#1e293b">Full-text articles rigorously assessed (n = _____)</text>
  </g>

  <!-- Reports Excluded with Reasons -->
  <g transform="translate(660, 560)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="26" font-size="14" font-weight="700" fill="#991b1b">Reports excluded:</text>
    <line x1="20" y1="36" x2="380" y2="36" stroke="#fecaca" stroke-width="1" />
    <text x="20" y="58" font-size="12" fill="#334155">? Incompatible baseline / methodology (n = _____)</text>
    <text x="20" y="78" font-size="12" fill="#334155">? Missing primary quantitative metrics (n = _____)</text>
    <text x="20" y="98" font-size="12" fill="#334155">? Irrelevant evaluation benchmark (n = _____)</text>
  </g>

  <!-- 5. Included in Review -->
  <g transform="translate(200, 690)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="400" height="120" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="30" font-size="14" font-weight="700" fill="#065f46">Studies included in review</text>
    <line x1="20" y1="42" x2="380" y2="42" stroke="#a7f3d0" stroke-width="1" />
    <text x="20" y="68" font-size="13" fill="#064e3b" font-weight="600">? New studies included in qualitative review (n = _____)</text>
    <text x="20" y="95" font-size="13" fill="#064e3b" font-weight="600">? Studies included in quantitative meta-analysis (n = _____)</text>
  </g>

  <!-- Connecting Arrows -->
  <!-- Top: Identification to Excluded -->
  <path d="M 600 185 L 652 185" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Identification down to Screened -->
  <path d="M 400 270 L 400 302" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Screened to Excluded -->
  <path d="M 600 352 L 652 352" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Screened down to Sought -->
  <path d="M 400 395 L 400 427" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Sought to Not Retrieved -->
  <path d="M 600 477 L 652 477" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Sought down to Assessed -->
  <path d="M 400 520 L 400 552" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Assessed to Excluded -->
  <path d="M 600 610 L 652 610" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Assessed down to Included -->
  <path d="M 400 655 L 400 682" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

</svg>